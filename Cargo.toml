[package]
name = "hyperssh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
dirs = "5"
hex = "0.4.3"
peeroxide = "1.7.3"
peeroxide-dht = "1.7.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }